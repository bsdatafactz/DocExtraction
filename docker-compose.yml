services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docextraction
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: bsdatafactz/docex-backend:v1
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/docextraction
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_BASE_URL: ${FOUNDRY_BASE_URL:-https://ai-training-msftfoundry.services.ai.azure.com/openai/v1/}
      DEEPSEEK_DEPLOYMENT: ${DEEPSEEK_DEPLOYMENT:-deepseek-v3.2}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: bsdatafactz/docex-frontend:v1
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
